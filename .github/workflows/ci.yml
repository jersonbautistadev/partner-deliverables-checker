name: Quality and release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deliverables
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: deliverables
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deliverables"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Check self-contained deployment requirements match the runtime lock
        run: python -c "from pathlib import Path; assert Path('requirements.txt').read_bytes() == Path('requirements.lock').read_bytes(), 'Copy requirements.lock to requirements.txt after updating runtime dependencies'"
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run --source=checker manage.py test --verbosity 2
      - run: coverage report -m
      - run: python -m pip_audit -r requirements.lock --disable-pip --no-deps
      - name: PostgreSQL client wrappers for isolated recovery tests
        run: |
          mkdir -p .runtime
          for command in pg_dump pg_restore; do
            cat > ".runtime/$command" <<'SH'
          #!/bin/sh
          command=$(basename "$0")
          exec docker run --rm --network host -v /tmp:/tmp -v "$PWD:$PWD:ro" -e PGPASSWORD -e PGSSLMODE -e PGSSLROOTCERT postgres:17-alpine "$command" "$@"
          SH
            chmod +x ".runtime/$command"
          done
      - name: Full PostgreSQL tests, row-lock races and encrypted restore
        run: python manage.py test --verbosity 2
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: deliverables
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: deliverables
          PG_DUMP: .runtime/pg_dump
          PG_RESTORE: .runtime/pg_restore
      - run: python manage.py collectstatic --noinput
      - name: Operator SQL contracts with isolated PostgreSQL boundary fixtures
        run: python scripts/rehearse_operations.py
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: deliverables
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: deliverables
      - name: Production configuration checks (fixture settings)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-key-with-enough-length-and-entropy-for-deploy-checks-729c6e25
          DJANGO_ALLOWED_HOSTS: staging.example.test
          CSRF_TRUSTED_ORIGINS: https://staging.example.test
          PUBLIC_BASE_URL: https://staging.example.test
          POSTGRES_HOST: localhost
          POSTGRES_USER: deliverables
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: deliverables
          EMAIL_HOST: smtp.example.test
          DEFAULT_FROM_EMAIL: noreply@example.test
          PUBLIC_SUPPORT_EMAIL: support@example.test
          OPS_SECRET: ci-only-operations-secret-not-a-production-key
      - name: Container build and Compose configuration
        env:
          DJANGO_SECRET_KEY: ci-only-key-with-enough-length-and-entropy-for-deploy-checks-729c6e25
          DJANGO_ALLOWED_HOSTS: staging.example.test
          CSRF_TRUSTED_ORIGINS: https://staging.example.test
          POSTGRES_DB: deliverables
          POSTGRES_USER: deliverables
          POSTGRES_PASSWORD: ci-only-password
          APP_DOMAIN: staging.example.test
          PUBLIC_SUPPORT_EMAIL: support@example.test
          EMAIL_HOST: smtp.example.test
          DEFAULT_FROM_EMAIL: noreply@example.test
          OPS_SECRET: ci-only-operations-secret-not-a-production-key
          EMAIL_HOST_USER: fixture
          EMAIL_HOST_PASSWORD: fixture
          BACKUP_ENCRYPTION_KEY: fixture-not-used-by-build
        run: |
          docker compose --profile operations config --quiet
          docker compose --profile operations build app worker backup
