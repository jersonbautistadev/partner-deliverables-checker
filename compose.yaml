services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment: &app_environment
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PRIVATE_UPLOAD_ROOT: /var/lib/deliverables/private
      PUBLIC_BASE_URL: https://${APP_DOMAIN}
      EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      MAIL_HEALTH_MAX_AGE_SECONDS: ${MAIL_HEALTH_MAX_AGE_SECONDS:-900}
      MAIL_DAILY_ATTEMPT_LIMIT: ${MAIL_DAILY_ATTEMPT_LIMIT:-0}
      MAX_SERVICE_WORKSPACES: ${MAX_SERVICE_WORKSPACES:-0}
      PUBLIC_SUPPORT_EMAIL: ${PUBLIC_SUPPORT_EMAIL:?Set PUBLIC_SUPPORT_EMAIL}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL}
      OPS_SECRET: ${OPS_SECRET:?Set OPS_SECRET}
      TRUST_PROXY_HEADERS: "1"
    volumes:
      - private_files:/var/lib/deliverables/private
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8000),2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    pids_limit: 100
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "manage.py", "send_mail_queue"]
    environment: *app_environment
    volumes:
      - private_files:/var/lib/deliverables/private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  backup:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    environment:
      <<: *app_environment
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
    volumes:
      - private_files:/var/lib/deliverables/private
      - ${BACKUP_DIRECTORY:-./.local-backups}:/backups
  edge:
    image: nginx:1.28-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    expose: ["8080"]
    depends_on: [app]
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: ["80:80", "443:443"]
    depends_on: [edge]
    restart: unless-stopped
volumes:
  postgres_data:
  private_files:
  caddy_data:
  caddy_config:
