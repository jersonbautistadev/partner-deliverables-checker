events { worker_connections 1024; }
http {
    # Request size is bounded before Django parses multipart bodies.
    client_max_body_size 6m;
    client_body_timeout 15s;
    # Caddy overwrites this header; edge has no host-published port.
    limit_req_zone $http_x_forwarded_for zone=login:10m rate=5r/m;
    server {
        listen 8080;
        # Behind the private Caddy service only. No original upload path is served.
        location = /accounts/login/ {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 35s;
        }
    }
}
