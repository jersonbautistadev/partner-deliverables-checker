<rect x="430" y="430" width="320" height="118" rx="12"/>
<rect x="840" y="430" width="295" height="118" rx="12"/>
</g>
<g font-size="18" font-weight="bold">
<text x="88" y="246">Browser</text><text x="453" y="246">Sessions + authorization</text><text x="863" y="246">Application services</text>
<text x="88" y="468">Deterministic engine</text><text x="453" y="468">Database</text><text x="863" y="468">Private original files</text>
</g>
<g font-size="13" fill="#75887e">
<text x="88" y="273">Server-rendered forms and reports</text><text x="88" y="294">Coordinator / contributor views</text>
<text x="453" y="273">Django login + CSRF protection</text><text x="453" y="294">Role checks + package ownership</text>
<text x="863" y="273">Transactions, fingerprints, audit</text><text x="863" y="294">Versioned reports and reviews</text>
<text x="88" y="495">Bounded TXT / DOCX / JPG / PNG</text><text x="88" y="516">Pure Python rules + Pillow</text>
<text x="453" y="495">SQLite local / PostgreSQL deployed</text><text x="453" y="516">Instructions, history, digests, results</text>
<text x="863" y="495">Random names outside static assets</text><text x="863" y="516">Authorized attachment downloads</text>
</g>
