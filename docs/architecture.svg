<rect x="65" y="607" width="1070" height="85" rx="12" fill="#e8f2eb"/>
<text x="88" y="638" font-size="15" font-weight="bold" fill="#40745b">Why results stay current</text>
<text x="88" y="664" font-size="14" fill="#62836d">Engine version + instruction revisions + validated file digests / availability → input fingerprint → current report</text>
<text x="65" y="731" font-size="12" fill="#84998b">Production boundary: HTTPS / Caddy → request limits / Nginx → Gunicorn / Django. Only HTTPS ports are public.</text>
</g></svg>
