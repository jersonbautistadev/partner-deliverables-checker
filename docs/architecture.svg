<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Partner Deliverables Checker architecture</title><desc id="desc">A browser accesses Django session and role checks, which call transactional services. Services use a pure deterministic engine, a database, and private original files. Downloads require authorization.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#7f9c91" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="760" fill="#f5f8f6"/>
<g font-family="Arial, sans-serif" fill="#203b32">
<text x="65" y="65" font-size="13" letter-spacing="2" fill="#137b70">PARTNER DELIVERABLES CHECKER</text>
<text x="65" y="110" font-size="32" font-weight="bold">One team. A traceable checking workflow.</text>
<text x="65" y="142" font-size="15" fill="#75887e">Django application design · Engine verified; web runtime validation pending</text>
<g fill="white" stroke="#dce6df" stroke-width="1.5">
<rect x="65" y="208" width="275" height="111" rx="12"/>
<rect x="430" y="208" width="320" height="111" rx="12"/>
