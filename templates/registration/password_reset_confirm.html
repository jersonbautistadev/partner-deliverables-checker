{% extends 'base.html' %}{% block title %}Choose a new password | PartnerReady{% endblock %}{% block content %}<div class="account-page"><h1>Choose a new password</h1>{% if validlink %}<form method="post" class="account-form">{% csrf_token %}{{ form.as_p }}<button class="button" type="submit">Save password</button></form>{% else %}<p>This link is invalid, expired, or already used.</p><a href="{% url 'password_reset' %}">Request a new link</a>{% endif %}</div>{% endblock %}
